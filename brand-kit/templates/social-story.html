<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Social story</title>
<!--
  Template: story, 1080 x 1920 px. Screen only.
  Safe zone: platform UI covers about the top 250 px and the bottom 340 px, so the lockup, headline, call to action
  and URL sit between y 280 and y 1580. Only the ribbon, the swallow's wingtip and the navy ground run outside it.
  Copy: "The AI team you don't have to hire." (Brand DNA section 7) and "We build it, run it, and help you grow."
  The call to action is the site's primary one, "See where AI can help" (the AI check-up). Stories are not tappable:
  add the platform's link sticker over the button area when posting.
  Alliance Blue appears once, on the call to action. The swallow is the full-colour mascot from the logo kit.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<style>
  html, body { margin: 0; background: var(--aap-color-neutral-200); }
  .story {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--aap-color-brand-daylight); color: var(--aap-color-text-primary);
    font-family: var(--aap-font-family-sans); -webkit-font-smoothing: antialiased;
  }
  .story__navy {
    position: absolute; left: 0; right: 0; bottom: 0; height: 680px;
    background: var(--aap-color-brand-partner-navy); color: var(--aap-color-text-inverse);
  }
  .story__ribbon { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Lockup artboard 1139 x 378, 69-unit clear space: at 316 px wide the clear space is 19 px. */
  .story__logo { position: absolute; left: 61px; top: 281px; width: 316px; height: auto; display: block; }
  .story__swallow { position: absolute; left: 722px; top: 232px; width: 296px; height: auto; display: block; }
  h1 {
    position: absolute; left: 80px; top: 476px; width: 920px; margin: 0;
    font-weight: var(--aap-typography-display-xl-weight); font-stretch: var(--aap-typography-display-xl-stretch);
    font-size: 140px; line-height: 0.98; letter-spacing: var(--aap-typography-display-xl-tracking);
    text-wrap: balance;
  }
  .story__line {
    position: absolute; left: 82px; top: 940px; width: 860px; margin: 0;
    font-size: 46px; line-height: 1.28; font-weight: 450; letter-spacing: -0.01em;
    color: var(--aap-color-text-secondary); text-wrap: balance;
  }
  .story__cta {
    position: absolute; z-index: 1; left: 80px; top: 156px; margin: 0;
    display: inline-flex; align-items: center; gap: 22px;
    height: 112px; padding: 0 48px 0 52px; border-radius: 22px;
    background: var(--aap-color-action-primary); color: var(--aap-color-text-on-action);
    box-shadow: var(--aap-shadow-facet-edge);
    font-size: 42px; line-height: 1; font-weight: var(--aap-typography-label-weight); letter-spacing: 0;
  }
  .story__cta svg { width: 44px; height: 44px; flex: none; }
  .story__url {
    position: absolute; z-index: 1; left: 82px; top: 304px; margin: 0;
    font-family: var(--aap-font-family-mono); font-size: 32px; line-height: 1; font-weight: 450;
    color: var(--aap-color-text-inverse-secondary);
  }
</style>
</head>
<body>
  <div class="story" id="artefact">
    <div class="story__navy">
      <p class="story__cta">See where AI can help
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </p>
      <p class="story__url">allianceaipartners.example</p>
    </div>
    <svg class="story__ribbon" viewBox="0 0 1080 1920" aria-hidden="true">
      <defs>
        <linearGradient id="st-daybreak" gradientUnits="userSpaceOnUse" x1="0" y1="1170" x2="1080" y2="1300">
          <stop offset="0" style="stop-color: var(--aap-color-brand-partner-navy)"/>
          <stop offset="0.54" style="stop-color: var(--aap-color-brand-alliance-blue)"/>
          <stop offset="1" style="stop-color: var(--aap-color-brand-ribbon-cyan)"/>
        </linearGradient>
        <linearGradient id="st-light" gradientUnits="userSpaceOnUse" x1="0" y1="1170" x2="1080" y2="1300">
          <stop offset="0" style="stop-color: var(--aap-color-shading-ribbon-57)"/>
          <stop offset="1" style="stop-color: var(--aap-color-brand-ribbon-cyan)"/>
        </linearGradient>
        <path id="st-path" d="M-60 1176 C240 1182 420 1250 600 1290 S900 1340 1140 1306"/>
      </defs>
      <use href="#st-path" fill="none" stroke="url(#st-daybreak)" stroke-width="58"/>
      <use href="#st-path" fill="none" stroke="url(#st-light)" stroke-width="17" transform="translate(0 -20.5)"/>
    </svg>
    <img class="story__logo" src="../../design-system/logos/lockups/alliance-ai-partners-primary-horizontal-full-color-light.svg" alt="Alliance AI Partners">
    <img class="story__swallow" src="../../design-system/imagery/graphics/mascot-swallow-fullcolor.svg" alt="">
    <h1>The AI team you don’t have to hire.</h1>
    <p class="story__line">We build it, run it, and help you grow.</p>
  </div>
</body>
</html>
